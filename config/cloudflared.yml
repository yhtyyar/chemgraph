# Cloudflare Tunnel Configuration for Chemgraph
# =============================================================================
# This file is generated by scripts/setup-tunnel.ps1
# DO NOT EDIT MANUALLY - run the setup script instead
# =============================================================================

# Tunnel ID (UUID) - REPLACE WITH YOUR TUNNEL ID
tunnel: REPLACE_WITH_YOUR_TUNNEL_ID

# Path to credentials file (generated by cloudflared tunnel login)
# Windows path with forward slashes
credentials-file: C:/Users/USER/.cloudflared/REPLACE_WITH_YOUR_TUNNEL_ID.json

# Ingress rules - traffic routing
ingress:
  # Main domain -> Ghost via Nginx (port 80)
  - hostname: chemgraph.ru
    service: http://localhost:80
    originRequest:
      connectTimeout: 30s
      tlsTimeout: 10s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      noTLSVerify: true  # For local development with self-signed certs

  # www subdomain -> same as main
  - hostname: www.chemgraph.ru
    service: http://localhost:80
    originRequest:
      connectTimeout: 30s
      tlsTimeout: 10s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      noTLSVerify: true

  # Admin subdomain (optional) -> Ghost admin
  # - hostname: admin.chemgraph.ru
  #   service: http://localhost:80
  #   originRequest:
  #     connectTimeout: 30s

  # API subdomain (Phase 3+) -> Python services
  # - hostname: api.chemgraph.ru
  #   service: http://localhost:8000
  #   originRequest:
  #     connectTimeout: 30s

  # Catch-all: return 404 for unmatched hostnames
  - service: http_status:404

# Warp routing (optional, for Zero Trust)
# warp-routing:
#   enabled: true

# Logging
loglevel: info
logfile: C:/Users/USER/.cloudflared/chemgraph.log

# Transport protocol (quic for better performance)
protocol: quic

# Graceful shutdown
grace-period: 30s

# Retry settings
retries: 3
retry-interval: 1s