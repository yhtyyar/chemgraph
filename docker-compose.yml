version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: chemgraph-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ghost_content:/var/lib/ghost/content:ro
    depends_on:
      ghost:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - chemgraph-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ghost:
    build:
      context: .
      dockerfile: Dockerfile.ghost
      args:
        GHOST_VERSION: ${GHOST_VERSION:-5.100}
    container_name: chemgraph-ghost
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - GHOST_URL=${GHOST_URL:-http://localhost}
      - GHOST_ADMIN_URL=${GHOST_ADMIN_URL:-http://localhost/ghost}
      - database__client=mysql
      - database__connection__host=mysql
      - database__connection__port=3306
      - database__connection__user=${MYSQL_USER:-ghost}
      - database__connection__password=${MYSQL_PASSWORD}
      - database__connection__database=${MYSQL_DATABASE:-ghost}
      - url__utils__redis__host=redis
      - url__utils__redis__port=6379
      - url__utils__redis__password=${REDIS_PASSWORD}
      - mail__transport=${MAIL_TRANSPORT:-SMTP}
      - mail__options__host=${SMTP_HOST}
      - mail__options__port=${SMTP_PORT}
      - mail__options__secure=${SMTP_SECURE:-true}
      - mail__options__auth__user=${SMTP_USER}
      - mail__options__auth__pass=${SMTP_PASS}
      - mail__from=${SMTP_FROM:-"Chemgraph <noreply@localhost>"}
      - logging__level=info
      - spam__prevention__enabled=true
    volumes:
      - ghost_content:/var/lib/ghost/content
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2368/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - chemgraph-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  mysql:
    image: mysql:8.0
    container_name: chemgraph-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ghost}
      - MYSQL_USER=${MYSQL_USER:-ghost}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql/conf.d:/etc/mysql/conf.d:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
      - --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - chemgraph-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: chemgraph-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chemgraph-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  ghost_content:
    driver: local

networks:
  chemgraph-network:
    driver: bridge
    name: chemgraph-network