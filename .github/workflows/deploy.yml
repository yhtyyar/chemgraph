# GitHub Actions CD Pipeline for Chemgraph
# =============================================================================
# Builds and pushes Docker images on push to main/develop
# Manual deployment to production via environment approval
# =============================================================================

name: Deploy

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy (optional, defaults to latest)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/chemgraph-ghost

jobs:
  # =============================================================================
  # BUILD & PUSH (on push to main/develop or tag)
  # =============================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Chemgraph Ghost
            org.opencontainers.image.description=Ghost CMS for Chemgraph
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ghost
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GHOST_VERSION=${{ vars.GHOST_VERSION || '5.100' }}

      - name: Output image info
        run: |
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  # =============================================================================
  # DEPLOY TO STAGING (auto on push to develop)
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.chemgraph.ru
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Staging VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            cd /opt/chemgraph
            echo "Pulling latest image..."
            docker pull ${{ needs.build-and-push.outputs.image-tag }}
            echo "Updating stack..."
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --no-deps ghost
            echo "Waiting for health check..."
            sleep 15
            curl -f https://staging.chemgraph.ru/health || exit 1
            echo "Staging deployment successful!"

  # =============================================================================
  # DEPLOY TO PRODUCTION (manual approval required)
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://chemgraph.ru
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            set -e
            cd /opt/chemgraph
            echo "=== Production Deployment Started ==="
            echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"

            # Pull new image
            echo "Pulling image..."
            docker pull ${{ needs.build-and-push.outputs.image-tag }}

            # Rolling update for zero-downtime
            echo "Starting rolling update..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale ghost=3 ghost
            sleep 30

            # Health check
            echo "Running health checks..."
            for i in {1..6}; do
              if curl -f -s https://chemgraph.ru/health > /dev/null; then
                echo "Health check passed"
                break
              fi
              echo "Waiting for health... ($i/6)"
              sleep 10
            done

            # Scale back to normal replicas
            echo "Scaling to normal replicas..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale ghost=2 ghost

            # Final verification
            echo "Final verification..."
            curl -f https://chemgraph.ru/health
            curl -f https://chemgraph.ru/ghost/ -o /dev/null -w "%{http_code}" | grep -q "200\|302"

            echo "=== Production Deployment Successful ==="

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          # Add Slack/Telegram notification here if needed

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Production deployment failed!"
          # Add alert notification here

  # =============================================================================
  # MANUAL DEPLOY (workflow_dispatch)
  # =============================================================================
  manual-deploy:
    name: Manual Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event.inputs.environment }}
      url: ${{ github.event.inputs.environment == 'production' && 'https://chemgraph.ru' || 'https://staging.chemgraph.ru' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine target
        id: target
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "host=${{ secrets.PROD_HOST }}" >> $GITHUB_OUTPUT
            echo "user=${{ secrets.PROD_USER }}" >> $GITHUB_OUTPUT
            echo "key=${{ secrets.PROD_SSH_KEY }}" >> $GITHUB_OUTPUT
            echo "port=${{ secrets.PROD_PORT || 22 }}" >> $GITHUB_OUTPUT
            echo "compose=docker-compose.prod.yml" >> $GITHUB_OUTPUT
            echo "url=https://chemgraph.ru" >> $GITHUB_OUTPUT
          else
            echo "host=${{ secrets.STAGING_HOST }}" >> $GITHUB_OUTPUT
            echo "user=${{ secrets.STAGING_USER }}" >> $GITHUB_OUTPUT
            echo "key=${{ secrets.STAGING_SSH_KEY }}" >> $GITHUB_OUTPUT
            echo "port=${{ secrets.STAGING_PORT || 22 }}" >> $GITHUB_OUTPUT
            echo "compose=docker-compose.yml -f docker-compose.staging.yml" >> $GITHUB_OUTPUT
            echo "url=https://staging.chemgraph.ru" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to ${{ github.event.inputs.environment }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ steps.target.outputs.user }}
          key: ${{ steps.target.outputs.key }}
          port: ${{ steps.target.outputs.port }}
          script: |
            set -e
            cd /opt/chemgraph
            IMAGE_TAG="${{ github.event.inputs.image_tag || needs.build-and-push.outputs.image-tag }}"
            echo "Deploying $IMAGE_TAG to ${{ github.event.inputs.environment }}"

            docker pull $IMAGE_TAG
            docker compose -f ${{ steps.target.outputs.compose }} up -d --no-deps ghost
            sleep 15

            curl -f ${{ steps.target.outputs.url }}/health || exit 1
            echo "Deployment successful!"

  # =============================================================================
  # TAG RELEASE (on version tag push)
  # =============================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify release
        run: |
          echo "🎉 Release ${{ github.ref_name }} created!"
          # Add notification here