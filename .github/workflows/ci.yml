# GitHub Actions CI Pipeline for Chemgraph
# =============================================================================
# Runs on every push and PR: lint, test, build, security scan
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/chemgraph-ghost

jobs:
  # =============================================================================
  # LINT & VALIDATE
  # =============================================================================
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config > /dev/null

      - name: Validate JSON configs
        run: |
          python3 -m json.tool config/ghost/config.production.json > /dev/null
          echo "JSON configs valid"

      - name: Validate YAML configs
        run: |
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('config/cloudflared.yml'))"
          echo "YAML configs valid"

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.ghost
          failure-threshold: error

      - name: Check .env.example has all required vars
        run: |
          REQUIRED_VARS=(
            "GHOST_VERSION"
            "NODE_ENV"
            "GHOST_URL"
            "MYSQL_ROOT_PASSWORD"
            "MYSQL_DATABASE"
            "MYSQL_USER"
            "MYSQL_PASSWORD"
            "REDIS_PASSWORD"
            "SMTP_HOST"
            "SMTP_PORT"
            "SMTP_USER"
            "SMTP_PASS"
            "SMTP_FROM"
            "JWT_SECRET"
          )
          for var in "${REQUIRED_VARS[@]}"; do
            if ! grep -q "^${var}=" .env.example; then
              echo "::error::Missing required variable in .env.example: $var"
              exit 1
            fi
          done
          echo "All required variables present in .env.example"

  # =============================================================================
  # SECURITY SCANNING
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy FS results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs.sarif'

      - name: Run gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: '--verbose --redact'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sbom.spdx.json
          category: sbom

  # =============================================================================
  # BUILD DOCKER IMAGE
  # =============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, security]
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Ghost image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Chemgraph Ghost
            org.opencontainers.image.description=Ghost CMS for Chemgraph
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Ghost image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ghost
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GHOST_VERSION=${{ vars.GHOST_VERSION || '5.100' }}

      - name: Run Trivy on built image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy Image results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image.sarif'

  # =============================================================================
  # INTEGRATION TEST (Spin up stack and verify)
  # =============================================================================
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cp .env.example .env
          echo "GHOST_VERSION=5.100" >> .env
          echo "NODE_ENV=development" >> .env
          echo "GHOST_URL=http://localhost" >> .env
          echo "GHOST_ADMIN_URL=http://localhost/ghost" >> .env
          echo "MYSQL_ROOT_PASSWORD=test_root_password" >> .env
          echo "MYSQL_DATABASE=ghost" >> .env
          echo "MYSQL_USER=ghost" >> .env
          echo "MYSQL_PASSWORD=test_ghost_password" >> .env
          echo "REDIS_PASSWORD=test_redis_password" >> .env
          echo "SMTP_HOST=smtp.example.com" >> .env
          echo "SMTP_PORT=465" >> .env
          echo "SMTP_USER=test@example.com" >> .env
          echo "SMTP_PASS=test_password" >> .env
          echo "SMTP_FROM=\"Test <noreply@example.com>\"" >> .env
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> .env

      - name: Start stack
        run: |
          docker compose up -d --build
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Check service health
        run: |
          docker compose ps
          # Wait for all services to be healthy
          for i in {1..30}; do
            if docker compose ps --format json | jq -r 'select(.Health != "healthy")' | grep -q .; then
              echo "Waiting for healthy services... ($i/30)"
              sleep 10
            else
              echo "All services healthy!"
              break
            fi
          done

      - name: Test Ghost health endpoint
        run: |
          for i in {1..10}; do
            if curl -f -s http://localhost:2368/health > /dev/null; then
              echo "Ghost health check passed"
              exit 0
            fi
            echo "Waiting for Ghost... ($i/10)"
            sleep 5
          done
          echo "Ghost health check failed"
          docker compose logs ghost --tail=50
          exit 1

      - name: Test Nginx proxy
        run: |
          if curl -f -s http://localhost/health > /dev/null; then
            echo "Nginx proxy health check passed"
          else
            echo "Nginx proxy health check failed"
            docker compose logs nginx --tail=50
            exit 1
          fi

      - name: Test Ghost admin accessible
        run: |
          if curl -f -s -o /dev/null -w "%{http_code}" http://localhost/ghost/ | grep -q "200\|302"; then
            echo "Ghost admin accessible"
          else
            echo "Ghost admin not accessible"
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # =============================================================================
  # DEPENDENCY REVIEW (for PRs)
  # =============================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  # =============================================================================
  # CODEQL ANALYSIS
  # =============================================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [javascript, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"